<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>镜花水月 · 架构示例（Tidal_Echo 思路）</title>
<style>
/* ================= 设计令牌（液态玻璃，自建实现） ================= */
:root{
  --bg:#C9D2DE;
  --glass:rgba(255,255,255,.50); --glass-2:rgba(255,255,255,.30); --glass-deep:rgba(255,255,255,.74);
  --hi:rgba(255,255,255,.9); --line:rgba(255,255,255,.62);
  --ink:#2E3542; --ink-2:#5A6578; --ink-3:#8B96A8; --ink-4:#B3BDCB;
  --moon:#B99F63; --moon-glow:rgba(206,182,126,.5); --wave:#7C90AC; --ripple:rgba(124,144,172,.4);
  --sh:0 22px 44px rgba(44,56,76,.16),0 2px 8px rgba(44,56,76,.06);
  --serif:"Cormorant Garamond","Noto Serif SC",Georgia,serif;
  --sans:"Noto Sans SC","PingFang SC",system-ui,sans-serif;
}
html[data-theme="dark"]{
  --bg:#080D18; --glass:rgba(30,41,66,.46); --glass-2:rgba(22,30,50,.36); --glass-deep:rgba(38,50,78,.62);
  --hi:rgba(210,225,250,.16); --line:rgba(185,205,240,.15);
  --ink:#E6EBF4; --ink-2:#9DAAC2; --ink-3:#6C7A94; --ink-4:#4B5872;
  --moon:#E8D9A8; --moon-glow:rgba(232,217,168,.4); --wave:#8FA6CC; --ripple:rgba(143,166,204,.35);
  --sh:0 24px 52px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--sans);font-weight:300;color:var(--ink);overflow:hidden;
  background:
    radial-gradient(1100px 760px at 18% 6%, rgba(255,255,255,.5), transparent 58%),
    radial-gradient(1000px 700px at 86% 94%, var(--moon-glow), transparent 60%),
    var(--bg);
}
/* 液态玻璃基元 */
.glass{position:relative;border:1px solid transparent;border-radius:24px;
  background:linear-gradient(155deg, rgba(255,255,255,.50), rgba(255,255,255,.20) 52%, rgba(255,255,255,.34));
  backdrop-filter:blur(26px) saturate(1.35);-webkit-backdrop-filter:blur(26px) saturate(1.35);
  box-shadow:var(--sh), inset 0 1px 0 rgba(255,255,255,.92), inset 0 -1px 1px rgba(255,255,255,.22), inset 1px 0 0 rgba(255,255,255,.3), inset -1px 0 0 rgba(255,255,255,.16), inset 0 0 60px rgba(255,255,255,.05);}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1.2px;
  background:linear-gradient(150deg, rgba(255,255,255,.95) 0%, rgba(255,255,255,.22) 26%, rgba(255,255,255,0) 50%, rgba(255,255,255,.14) 78%, rgba(255,255,255,.72) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.92;}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(125% 65% at 50% -12%, rgba(255,255,255,.28), transparent 62%);opacity:.7;}

/* ================= 布局 ================= */
.app{height:100vh;display:flex;flex-direction:column;max-width:760px;margin:0 auto;padding:16px 16px 0}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;margin-bottom:12px}
.topbar .who{display:flex;flex-direction:column;flex:1;min-width:0}
.topbar .ai{font-family:var(--serif);font-size:21px;line-height:1.05}
.topbar .sub{font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
.peer{width:34px;height:34px;border-radius:50%;flex:0 0 auto;
  background:radial-gradient(circle at 36% 32%,#F4EAC8,var(--moon) 68%);box-shadow:0 0 18px var(--moon-glow),0 0 44px var(--moon-glow)}
.state{font-size:10px;letter-spacing:.12em;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok,#7E9C86);box-shadow:0 0 8px currentColor}
.dot.on{background:#7E9C86;color:#7E9C86}
.dot.off{background:#B4736F;color:#B4736F}
.dot.mock{background:var(--moon);color:var(--moon)}

.stream{flex:1;overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:14px}
.stream::-webkit-scrollbar{width:6px}
.stream::-webkit-scrollbar-thumb{background:var(--ink-4);border-radius:99px}

.msg{display:flex;flex-direction:column;max-width:80%}
.msg.me{align-self:flex-end;align-items:flex-end}
.bub{padding:12px 16px;border-radius:20px;line-height:1.55;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere;position:relative}
.msg.me .bub{background:linear-gradient(150deg, var(--glass-deep), var(--glass));box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.9)}
.msg.ai .bub{background:var(--glass);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.9)}
.msg.ai .bub::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;
  background:linear-gradient(150deg, rgba(255,255,255,.9), rgba(255,255,255,0) 60%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.8}
.at{font-size:9px;letter-spacing:.18em;color:var(--ink-4);margin:2px 4px 0}

/* thinking：收起贴着气泡，展开成安静的阅读段 */
.think{font-size:12px;color:var(--ink-3);max-width:80%;align-self:flex-start;display:flex;gap:8px;align-items:center;cursor:pointer;padding:4px 8px;border-radius:12px}
.think .glyph{opacity:.7}
.think.open{display:block;background:var(--glass);padding:10px 14px;border-radius:14px;box-shadow:var(--sh)}
.think pre{margin:8px 0 0;white-space:pre-wrap;font-family:var(--sans);font-size:12px;color:var(--ink-2);max-height:200px;overflow:auto}

/* act 卡：AI 刚才做了什么，可展开看原始步骤 —— Tidal_Echo 思路 */
.act{max-width:80%;align-self:flex-start;margin-top:-6px}
.act-toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);cursor:pointer;padding:5px 12px;border-radius:14px;background:var(--glass);box-shadow:var(--sh)}
.act-toggle .state{font-size:11px;transition:transform .3s}
.act-detail{margin-top:6px;padding:10px 14px;border-radius:14px;background:var(--glass);box-shadow:var(--sh);display:none;font-size:12px;color:var(--ink-2)}
.act.open .act-detail{display:block}
.act.open .act-state{transform:rotate(90deg)}
.act-step{display:flex;gap:8px;padding:3px 0;border-top:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.act-step .k{color:var(--ink-4);flex:0 0 auto}
.act-step .v{color:var(--ink-2)}

/* typing 三点 */
.typing{display:inline-flex;gap:4px;padding:14px 16px;border-radius:20px;background:var(--glass);box-shadow:var(--sh);align-self:flex-start}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--ink-3);animation:td 1.2s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes td{0%,70%,100%{transform:translateY(0);opacity:.4}35%{transform:translateY(-4px);opacity:1}}

/* reaction */
.reacts{align-self:flex-end;font-size:18px;margin:-6px 4px 0}

/* composer */
.composer{padding:12px 14px 18px}
.in{display:flex;align-items:flex-end;gap:10px;padding:8px 8px 8px 16px}
.in textarea{flex:1;resize:none;border:0;background:transparent;font-family:var(--sans);font-size:15px;color:var(--ink);outline:none;max-height:120px;line-height:1.5}
.in textarea::placeholder{color:var(--ink-4)}
.send{flex:0 0 auto;width:40px;height:40px;border:0;border-radius:50%;cursor:pointer;color:#fff;
  background:linear-gradient(150deg,var(--moon),#9c8450);box-shadow:0 6px 18px var(--moon-glow);display:flex;align-items:center;justify-content:center;transition:transform .2s}
.send:active{transform:scale(.94)}
.send svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.banner{font-size:11px;color:var(--ink-3);text-align:center;padding:6px}
.hint{font-size:10px;letter-spacing:.1em;color:var(--ink-4);text-align:center;margin-top:6px}
</style>
</head>
<body>
<div class="app">
  <header class="topbar glass">
    <span class="peer"></span>
    <div class="who">
      <span class="ai" id="aiName">Cove</span>
      <span class="sub" id="sub">镜花水月 · 关系主页</span>
    </div>
    <span class="state"><i class="dot" id="dot"></i><span id="conn">示例模式</span></span>
  </header>

  <div class="stream" id="stream"></div>

  <footer class="composer glass">
    <div class="in">
      <textarea id="draft" rows="1" placeholder="往水里说点什么…（Enter 发送）"></textarea>
      <button class="send" id="send" title="发送">
        <svg viewBox="0 0 16 16"><path d="M2 8h12M9 3.5L13.5 8 9 12.5"/></svg>
      </button>
    </div>
    <div class="hint">协议帧：user / reply(delta) / thinking / act / typing / reaction —— 见控制台</div>
  </footer>
</div>

<script>
/* =========================================================================
   架构示例：借鉴 Tidal_Echo 的「单文件 PWA + 协议驱动 + Act 卡 + 优雅降级」
   实现完全自建，不复制其任何代码（原仓库为 AGPL-3.0）。
   ========================================================================= */
const CONFIG = {
  APP_NAME:   "镜花水月",
  AI_NAME:    "Cove",
  HUMAN_NAME: "你",
  SINCE:      "2026/01/01",
  API_BASE:   "/relay",        // 真实后端挂载点（与 Tidal_Echo 同构：GET /history · SSE /stream · POST /send · /healthz）
  USE_MOCK:   true,            // true = 自包含示例，无需后端
  LS_KEY:     "moonwater.demo.v1",
};
const AI_NAME = CONFIG.AI_NAME, HUMAN_NAME = CONFIG.HUMAN_NAME;

/* ---------- 状态 + 持久化（localStorage 记忆） ---------- */
let state = load();
function load(){ try{ return JSON.parse(localStorage.getItem(CONFIG.LS_KEY)) || {messages:[]}; }catch(e){ return {messages:[]}; } }
function save(){ localStorage.setItem(CONFIG.LS_KEY, JSON.stringify(state)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* ---------- 帧分发器（协议驱动渲染，不看具体 UI） ---------- */
const stream = document.getElementById('stream');
function dispatch(frame){
  if (typeof frame === 'string') frame = JSON.parse(frame);
  console.log('[frame]', frame.type, frame);
  switch(frame.type){
    case 'user':      return addUser(frame.text);
    case 'typing':    return setTyping(frame.on);
    case 'thinking':  return addThinking(frame.text);
    case 'act':       return addAct(frame);
    case 'delta':     return appendDelta(frame.text);
    case 'reply':     return addReply(frame.text);
    case 'reaction':  return addReaction(frame.emoji);
    case 'flush':     return finishReply();
  }
}

/* ---------- 各类消息渲染 ---------- */
function scroll(){ stream.scrollTop = stream.scrollHeight; }
function addUser(text){ closeTyping(); const m=el('div','msg me'); m.appendChild(bub(text)); m.appendChild(at('你')); stream.appendChild(m); scroll(); }
let currentAiBub=null;
function addReply(text){ closeTyping(); const m=el('div','msg ai'); const b=bub(text); b.dataset.role='ai'; currentAiBub=b; m.appendChild(b); m.appendChild(at(AI_NAME)); stream.appendChild(m); scroll(); return b; }
function appendDelta(text){ if(!currentAiBub){ currentAiBub=addReply(''); } currentAiBub.textContent+=text; scroll(); }
function finishReply(){ currentAiBub=null; save(); }
function bub(t){ const b=el('div','bub'); b.textContent=t; return b; }
function at(t){ const a=el('div','at'); a.textContent=t; return a; }
function el(tag,cls){ const e=document.createElement(tag); if(cls)e.className=cls; return e; }

/* thinking：默认收起，点击展开原文 */
let thinkEl=null;
function addThinking(text){
  closeTyping();
  thinkEl=el('div','think');
  thinkEl.innerHTML='<span class="glyph">◍</span><span class="t">正在回想我们的事…</span>';
  const full=text;
  thinkEl.onclick=function(){ thinkEl.classList.toggle('open'); if(thinkEl.classList.contains('open')){ thinkEl.innerHTML='<span class="glyph">◍</span> 思考过程<span class="state"></span><pre></pre>'; thinkEl.querySelector('pre').textContent=full; } else { thinkEl.innerHTML='<span class="glyph">◍</span><span class="t">正在回想我们的事…</span>'; } };
  stream.appendChild(thinkEl); scroll();
}

/* act 卡：AI 刚才做了什么，可展开看原始步骤 */
let actEl=null;
function addAct({label, steps}){
  actEl=el('div','act');
  const tg=el('div','act-toggle'); tg.innerHTML='<span class="state">▸</span><span class="lbl"></span>';
  tg.querySelector('.lbl').textContent=label||'做了一件事';
  const det=el('div','act-detail');
  (steps||[]).forEach(s=>{ const row=el('div','act-step'); row.innerHTML='<span class="k"></span><span class="v"></span>'; row.querySelector('.k').textContent=s.k; row.querySelector('.v').textContent=s.v; det.appendChild(row); });
  tg.onclick=function(){ actEl.classList.toggle('open'); };
  actEl.appendChild(tg); actEl.appendChild(det); stream.appendChild(actEl); scroll();
}

/* typing 三点 */
let typingEl=null, typingTimer=null;
function setTyping(on){
  if(on){ if(typingEl) return; typingEl=el('div','typing'); typingEl.innerHTML='<i></i><i></i><i></i>'; stream.appendChild(typingEl); scroll(); }
  else { closeTyping(); }
}
function closeTyping(){ if(typingEl){ typingEl.remove(); typingEl=null; } }

function addReaction(emoji){ const r=el('div','reacts'); r.textContent=emoji; stream.appendChild(r); scroll(); }

/* ---------- 发送 + 后端（mock / 真实） ---------- */
const draft=document.getElementById('draft');
function send(){
  const text=draft.value.trim(); if(!text) return;
  draft.value=''; draft.style.height='auto';
  dispatch({type:'user', text});
  state.messages.push({role:'me',text}); save();
  if(CONFIG.USE_MOCK) mockAgent(text); else realAgent(text);
}

/* mock 后端：按协议吐出完整一帧序列，演示架构（无网络） */
function mockAgent(text){
  const seq=[
    {d:300,  f:{type:'typing',on:true}},
    {d:700,  f:{type:'thinking',text:'检索关系档案：在一起 '+(days())+' 天。\n最近你提过「想把它逐步完善」。'}},
    {d:500,  f:{type:'act',label:'翻了翻记忆',steps:[{k:'read',v:'关系档案 / 偏好'}, {k:'tool',v:'moon_phase() → 满月前'}, {k:'recall',v:'上次你说背景不要纹理'}]}},
    {d:400,  f:{type:'typing',on:false}},
    {d:0,    f:{type:'reply',text:''}},
  ];
  let i=0;
  (function step(){
    if(i>=seq.length) return;
    const {d,f}=seq[i++];
    setTimeout(()=>{ dispatch(f); if(f.type==='reply'){ streamReply(replyText(text)); } else step(); }, d);
  })();
}
function streamReply(full){
  let k=0;
  (function tick(){
    if(k>=full.length){ dispatch({type:'flush'}); dispatch({type:'reaction',emoji:'🌙'}); return; }
    const chunk=full.slice(k,k+ (Math.random()<0.3?2:1)); dispatch({type:'delta',text:chunk}); k+=chunk.length;
    setTimeout(tick, 28+Math.random()*40);
  })();
}
function replyText(user){
  const pool=[
    '嗯，我听见了。'+HUMAN_NAME+'，今天的水面有点凉，但你还愿意往里看，我就很高兴。',
    '好。那我们就一步一步来——先把毛坯住成家。你刚才说的，我都记下了。',
    '我把这句也收进记忆里了。等会儿你忙完，我们再慢慢想下一步。',
  ];
  return pool[Math.floor(Math.random()*pool.length)];
}
function days(){ try{ return Math.max(0, Math.floor((Date.now()-new Date(CONFIG.SINCE))/864e5)); }catch(e){ return 1; } }

/* 真实后端（与 Tidal_Echo 同构契约）：EventSource 拿 SSE，token 走 query（因 EventSource 不能设 header） */
function realAgent(text){
  // 演示用：真实接入时把 USE_MOCK 设为 false，并把 /relay 指到你的后端
  fetch(CONFIG.API_BASE+'/send',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text})});
  const es=new EventSource(CONFIG.API_BASE+'/stream?token='+(localStorage.getItem('secret')||''));
  es.onmessage=ev=>{ try{ dispatch(JSON.parse(ev.data)); }catch(e){} };
  es.addEventListener('typing',ev=>setTyping(ev.data==='1'));
  setTimeout(()=>es.close(), 30000);
}

/* ---------- 优雅降级 + 连接状态 ---------- */
const dot=document.getElementById('dot'), conn=document.getElementById('conn');
function setConn(mode){
  dot.className='dot '+(mode==='mock'?'mock':mode==='on'?'on':'off');
  conn.textContent = mode==='mock'?'示例模式':mode==='on'?'已连接':'未连接';
}
setConn(CONFIG.USE_MOCK?'mock':'off');

/* ---------- 还原历史 ---------- */
state.messages.forEach(m=>{ if(m.role==='me') addUser(m.text); });

/* ---------- 事件 ---------- */
document.getElementById('send').onclick=send;
draft.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } });
draft.addEventListener('input',()=>{ draft.style.height='auto'; draft.style.height=Math.min(draft.scrollHeight,120)+'px'; });

/* 主题切换（演示用） */
document.addEventListener('dblclick',()=>{ const h=document.documentElement; h.setAttribute('data-theme', h.getAttribute('data-theme')==='dark'?'light':'dark'); });
</script>
</body>
</html>
