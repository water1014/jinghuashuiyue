<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060A12">
<title>镜花水月 · 开屏</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+SC:wght@200;300;400&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   镜花水月 · 开屏 v2
   星天 → 月光 → 水面 → 椭圆银镜成形 → 裂纹 → 碎 → 镜片悬停
   九片：正中「镜」，外圈八片。每片自带一段镜框，碎时框跟着断。
   ========================================================================== */
:root{
  --bg:#060A12;
  --ink:#E9EEF7; --ink-2:#A3B0C6; --ink-3:#6B7A94; --ink-4:#414D63;
  --moon:#EFE2B8;
  --silver:rgba(214,228,250,.55); --silver-lit:rgba(255,255,255,.92);
  --serif:"Cormorant Garamond","Noto Serif SC",Georgia,"Songti SC",serif;
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{font-family:var(--sans);font-weight:300;color:var(--ink);-webkit-font-smoothing:antialiased}

/* ---------------- 背景 · 天 ---------------- */
.scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sky{
  position:absolute;inset:0;
  background:
    radial-gradient(120% 78% at 50% -12%, rgba(126,150,196,.26), transparent 62%),
    radial-gradient(80% 54% at 84% 92%, rgba(96,86,150,.22), transparent 66%),
    radial-gradient(60% 40% at 12% 22%, rgba(70,96,150,.16), transparent 70%),
    linear-gradient(180deg,#070C17 0%,#0A1122 42%,#0B1426 66%,#060A12 100%);
  opacity:0;transition:opacity 1.6s ease;
}
.sky.on{opacity:1}
.stars{position:absolute;inset:0}
.star{position:absolute;border-radius:50%;background:#EAF1FF;opacity:0;animation:twinkle 5.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.10;transform:scale(.72)}50%{opacity:.86;transform:scale(1)}}

/* 天上那轮月 */
.sky-moon{
  position:absolute;left:50%;top:9%;width:58px;height:58px;margin-left:-29px;border-radius:50%;
  background:
    radial-gradient(circle at 40% 34%, rgba(214,204,176,.34) 0 12%, transparent 40%),
    radial-gradient(circle at 66% 62%, rgba(206,196,168,.26) 0 9%, transparent 34%),
    radial-gradient(circle at 36% 32%, #FFFDF3,#F4E9C6 50%,#D9C68E 100%);
  box-shadow:
    0 0 28px rgba(239,226,184,.44),
    0 0 86px rgba(239,226,184,.22),
    0 0 180px rgba(200,190,150,.12);
  opacity:0;transform:translateY(-18px) scale(.84);
  transition:opacity 1.6s ease,transform 1.6s cubic-bezier(.2,.7,.2,1);
}
.sky-moon.on{opacity:1;transform:none}
.sky-moon::before{
  content:"";position:absolute;inset:-58px;border-radius:50%;
  background:radial-gradient(circle,rgba(239,226,184,.14) 0%,rgba(239,226,184,.05) 46%,transparent 70%);
  animation:breathe 8s ease-in-out infinite;
}
.sky-moon::after{
  content:"";position:absolute;inset:-26px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,252,238,.20),transparent 62%);
}
@keyframes breathe{0%,100%{opacity:.68;transform:scale(1)}50%{opacity:1;transform:scale(1.09)}}

/* ---------------- 背景 · 水 ---------------- */
.water{position:absolute;left:0;right:0;bottom:0;height:38%;opacity:0;transition:opacity 1.8s ease .3s}
.water.on{opacity:1}
.water::before{
  content:"";position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(198,218,248,.30) 24%,rgba(239,226,184,.42) 50%,rgba(198,218,248,.30) 76%,transparent);
}
.water::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(143,166,204,.10),rgba(6,10,18,.72) 58%,#060A12 100%);
}
.pillar{
  position:absolute;left:50%;top:0;width:16%;height:88%;transform:translateX(-50%);
  background:linear-gradient(180deg,rgba(239,226,184,.34),rgba(239,226,184,.14) 34%,rgba(198,218,248,.06) 70%,transparent);
  filter:blur(7px);
  animation:shimmer 9s ease-in-out infinite;
}
@keyframes shimmer{0%,100%{opacity:.78;transform:translateX(-50%) scaleX(1)}50%{opacity:1;transform:translateX(-50%) scaleX(1.16)}}
.wave{
  position:absolute;left:-12%;right:-12%;height:1.5px;border-radius:2px;
  background:linear-gradient(90deg,transparent,rgba(143,166,204,.26) 22%,rgba(214,228,250,.50) 50%,rgba(143,166,204,.26) 78%,transparent);
  filter:blur(.5px);
}
.wave.w1{top:13%;animation:drift 14s ease-in-out infinite}
.wave.w2{top:26%;opacity:.62;animation:drift 18s ease-in-out infinite reverse}
.wave.w3{top:44%;opacity:.44;animation:drift 22s ease-in-out infinite}
.wave.w4{top:66%;opacity:.28;animation:drift 27s ease-in-out infinite reverse}
@keyframes drift{0%,100%{transform:translateX(-3%) scaleX(1)}50%{transform:translateX(3%) scaleX(1.07)}}

.vignette{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 46%, transparent 44%, rgba(3,6,12,.52) 82%, rgba(3,6,12,.82) 100%)}
.grain{position:absolute;inset:0;background-image:var(--noise);opacity:.04;mix-blend-mode:overlay}

/* ---------------- 舞台 ---------------- */
.stage{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding-bottom:4vh}
.mirror{
  position:relative;width:var(--w,300px);height:var(--h,400px);
  opacity:0;transform:scale(.90);
  transition:opacity 1.3s ease,transform 1.3s cubic-bezier(.2,.7,.2,1);
  will-change:transform,opacity;
}
.mirror.on{opacity:1;transform:none}
.halo{
  position:absolute;inset:-9% -13%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 42%, rgba(180,204,246,.16), rgba(120,150,200,.07) 46%, transparent 70%);
  filter:blur(14px);opacity:0;transition:opacity 1.6s ease .3s;
}
.halo.on{opacity:1}
.base{position:absolute;inset:0;border-radius:50%;background:var(--face);transition:opacity .3s ease}
.base.off{opacity:0}

.shards{position:absolute;inset:0}
.shard-move{
  position:absolute;inset:0;pointer-events:none;
  transition:transform 1s cubic-bezier(.16,.84,.24,1),opacity .5s ease;
  will-change:transform;
}
.shard-float{position:absolute;inset:0;pointer-events:none}
.shards.lit .shard-float{animation:float 8.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(-4px)}50%{transform:translateY(4px)}}

/* 只有被裁出形状的那一层接指针。空白处不许挡道 */
.shard{
  position:absolute;inset:0;pointer-events:auto;
  transition:transform .5s cubic-bezier(.2,.8,.2,1),filter .5s ease,opacity .5s ease;
  will-change:transform,filter;
}
/* 碎后每片带一道亮边。drop-shadow 会顺着裁出来的形状走。 */
.shards.lit .shard{filter:drop-shadow(0 0 3px rgba(214,228,250,.42)) saturate(1)}
.shards.lit.dim .shard{opacity:.34;filter:drop-shadow(0 0 2px rgba(214,228,250,.24)) saturate(.58)}
.shards.lit .shard-move.hot .shard{
  opacity:1;
  filter:drop-shadow(0 0 14px rgba(226,238,255,.85)) brightness(1.24) saturate(1.08);
  transform:scale(1.035);
}

.face{position:absolute;inset:0;background:var(--face)}
.sweep{
  position:absolute;inset:0;
  background:linear-gradient(106deg,transparent 38%,rgba(255,255,255,.16) 48%,rgba(255,255,255,.03) 55%,transparent 64%);
  background-size:250% 100%;background-position:180% 0;
  animation:sweep 9.5s linear infinite;
  mix-blend-mode:screen;
}
@keyframes sweep{from{background-position:190% 0}to{background-position:-90% 0}}

/* 每片自带的一小段银框 */
.frame{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.frame .ring{fill:none;stroke:var(--silver);stroke-width:2.1;vector-effect:non-scaling-stroke}
.frame .inner{fill:none;stroke:rgba(255,255,255,.20);stroke-width:1;vector-effect:non-scaling-stroke}
.frame .glint{
  fill:none;stroke:var(--silver-lit);stroke-width:2.6;vector-effect:non-scaling-stroke;
  stroke-linecap:round;opacity:.9;animation:glint 6.4s ease-in-out infinite;
}
@keyframes glint{0%,100%{opacity:.28}46%{opacity:.95}}

.label{
  position:absolute;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:5px;
  text-align:center;pointer-events:none;opacity:0;transition:opacity 1s ease;
}
.label.on{opacity:1}
.label .c{
  font-family:var(--serif);font-size:31px;line-height:1;letter-spacing:.08em;
  color:#F6FAFF;text-shadow:0 0 20px rgba(198,218,248,.55),0 0 46px rgba(143,166,204,.34);
}
.label .line{width:22px;height:1px;background:linear-gradient(90deg,transparent,rgba(214,228,250,.7),transparent)}
.label .e{font-family:var(--serif);font-style:italic;font-size:9.5px;letter-spacing:.22em;color:rgba(163,176,198,.88);text-transform:lowercase}
.label.center .c{font-size:25px}
.label.center .line{width:16px}
.label.center .e{font-size:8.5px}

.cracks{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.cracks path{
  fill:none;stroke:rgba(232,242,255,.88);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1;stroke-dashoffset:1;
  transition:stroke-dashoffset .34s cubic-bezier(.4,0,.3,1);
}
.cracks path.glow{stroke:rgba(150,190,255,.28);stroke-width:5}
.cracks.fade{opacity:0;transition:opacity .5s ease}

.flash{
  position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%, rgba(240,246,255,.72), rgba(180,204,246,.20) 42%, transparent 70%);
  opacity:0;transform:scale(.5);
}
.flash.go{animation:flash 1.1s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes flash{0%{opacity:.9;transform:scale(.5)}60%{opacity:.28}100%{opacity:0;transform:scale(1.5)}}

.ghost{
  position:absolute;inset:0;border-radius:50%;
  border:1px solid rgba(143,166,204,.20);
  box-shadow:0 0 34px rgba(143,166,204,.10) inset;
  opacity:0;transition:opacity 1.8s ease .2s;
}
.ghost.on{opacity:1}

/* ---------------- HUD ---------------- */
.hud{position:fixed;inset:0;z-index:5;pointer-events:none}
.brand{
  position:absolute;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom));
  text-align:center;opacity:0;transform:translateY(8px);
  transition:opacity 1.2s ease,transform 1.2s cubic-bezier(.2,.8,.2,1);
}
.brand.on{opacity:1;transform:none}
.brand .c{font-family:var(--serif);font-size:20px;letter-spacing:.46em;text-indent:.46em;color:#DFE8F7}
.brand .e{font-family:var(--serif);font-style:italic;font-size:9.5px;letter-spacing:.30em;color:var(--ink-3);margin-top:7px}
.brand .h{font-size:11px;letter-spacing:.16em;color:var(--ink-4);margin-top:14px}

.replay{
  position:absolute;right:calc(16px + env(safe-area-inset-right));top:calc(16px + env(safe-area-inset-top));
  pointer-events:auto;border:1px solid rgba(143,166,204,.24);background:rgba(18,26,44,.46);
  color:var(--ink-2);font-family:var(--sans);font-size:11.5px;letter-spacing:.14em;
  padding:8px 16px;border-radius:99px;cursor:pointer;backdrop-filter:blur(12px);
  opacity:0;transition:opacity 1s ease,color .3s,border-color .3s,background .3s;
}
.replay.on{opacity:1}
.replay:hover{color:var(--ink);border-color:rgba(143,166,204,.48);background:rgba(24,34,56,.6)}

.caption{
  position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  text-align:center;opacity:0;transition:opacity .55s ease;pointer-events:none;
}
.caption.on{opacity:1}
.caption .c{font-family:var(--serif);font-size:58px;color:#F7FBFF;text-shadow:0 0 44px rgba(198,218,248,.6)}
.caption .n{font-size:12px;letter-spacing:.42em;text-indent:.42em;color:var(--ink-2);margin-top:16px}
.caption .e{font-family:var(--serif);font-style:italic;font-size:11px;letter-spacing:.26em;color:var(--ink-4);margin-top:7px}
.caption .tip{font-size:11px;letter-spacing:.16em;color:var(--ink-4);margin-top:24px}

@media (max-width:520px){
  .label .c{font-size:25px}
  .label.center .c{font-size:21px}
  .sky-moon{width:48px;height:48px;margin-left:-24px}
  .caption .c{font-size:46px}
}
@media (prefers-reduced-motion:reduce){
  .shard-float,.sweep,.wave,.star,.sky-moon::before,.pillar,.frame .glint{animation:none}
}
</style>
</head>
<body>

<div class="scene">
  <div class="sky" id="sky"><div class="stars" id="stars"></div></div>
  <div class="sky-moon" id="skyMoon"></div>
  <div class="water" id="water">
    <span class="pillar"></span>
    <span class="wave w1"></span><span class="wave w2"></span>
    <span class="wave w3"></span><span class="wave w4"></span>
  </div>
  <div class="vignette"></div>
  <div class="grain"></div>
</div>

<div class="stage">
  <div class="mirror" id="mirror">
    <div class="halo" id="halo"></div>
    <div class="base" id="base"></div>
    <div class="shards" id="shards"></div>
    <svg class="cracks" id="cracks" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg>
    <div class="flash" id="flash"></div>
    <div class="ghost" id="ghost"></div>
  </div>
</div>

<div class="hud">
  <button class="replay" id="replay">再看一次</button>
  <div class="brand" id="brand">
    <div class="c">镜花水月</div>
    <div class="e">Moon in the Water</div>
    <div class="h">点一片碎镜，进一处</div>
  </div>
  <div class="caption" id="caption"></div>
</div>

<script>
(function () {
  'use strict';

  /* ====================== 配置 ====================== */
  var PAGES = [
    { k:'mirror',  c:'镜', e:'mirror',  n:'关系主页' },   // 正中这一片
    { k:'room',    c:'水', e:'room',    n:'房间' },
    { k:'pills',   c:'药', e:'pills',   n:'药方' },
    { k:'moon',    c:'月', e:'moon',    n:'月相' },
    { k:'photo',   c:'影', e:'album',   n:'相册' },
    { k:'cycle',   c:'潮', e:'tide',    n:'经期' },
    { k:'pomo',    c:'钟', e:'focus',   n:'番茄' },
    { k:'diary',   c:'记', e:'diary',   n:'日记' },
    { k:'archive', c:'存', e:'archive', n:'存档' }
  ];
  var N  = 8;        // 外圈片数
  var VB = 1000;     // 逻辑坐标
  var C  = VB / 2;
  var R  = 476;      // 片形的半径，含镜框那一圈
  var RING = 470;    // 银框
  var RING_IN = 462; // 框内那道细亮线
  var RATIO = 0.74;  // 椭圆 宽比高
  var NS = 'http://www.w3.org/2000/svg';
  var REDUCE = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 镜面。九片共用同一份，拼起来才是一整块连续的镜子。
  // 顺序：镜中月 → 月辉 → 水痕 → 内暗角 → 主体 → 顶光
  var FACE = [
    'radial-gradient(ellipse 25% 19% at 50% 28.5%, rgba(255,253,243,.96) 0%, rgba(247,236,201,.74) 38%, rgba(226,212,172,.24) 64%, transparent 82%)',
    'radial-gradient(ellipse 68% 58% at 50% 29%, rgba(226,232,250,.17), transparent 70%)',
    'linear-gradient(118deg, transparent 43%, rgba(255,255,255,.055) 51%, transparent 59%)',
    'linear-gradient(104deg, transparent 65%, rgba(255,255,255,.038) 73%, transparent 81%)',
    'radial-gradient(ellipse 100% 100% at 50% 50%, transparent 54%, rgba(8,13,24,.30) 84%, rgba(6,10,18,.64) 100%)',
    'radial-gradient(ellipse 92% 92% at 50% 42%, rgba(58,76,116,.86) 0%, rgba(30,44,74,.93) 46%, rgba(12,20,36,.97) 100%)',
    'linear-gradient(180deg, rgba(198,218,248,.10), transparent 42%)'
  ].join(',');

  var $ = function (s) { return document.querySelector(s); };
  var rnd = function (a, b) { return a + Math.random() * (b - a); };
  var deg = function (d) { return d * Math.PI / 180; };

  var mirror = $('#mirror');
  var shardsBox = $('#shards');
  var cracks = $('#cracks');
  var base = $('#base');
  var halo = $('#halo');
  var ghost = $('#ghost');
  var flash = $('#flash');
  var brand = $('#brand');
  var replayBtn = $('#replay');
  var caption = $('#caption');

  /* ====================== 星点 ====================== */
  (function stars() {
    var box = $('#stars'), i, s, n = 46;
    for (i = 0; i < n; i++) {
      s = document.createElement('span');
      s.className = 'star';
      var size = rnd(0.8, 2.1);
      s.style.width = size.toFixed(2) + 'px';
      s.style.height = size.toFixed(2) + 'px';
      s.style.left = rnd(2, 98).toFixed(2) + '%';
      s.style.top = rnd(1, 58).toFixed(2) + '%';
      s.style.animationDelay = (-rnd(0, 5.2)).toFixed(2) + 's';
      s.style.animationDuration = rnd(3.6, 7.4).toFixed(2) + 's';
      s.style.boxShadow = '0 0 ' + rnd(2, 5).toFixed(1) + 'px rgba(226,238,255,.7)';
      box.appendChild(s);
    }
  })();

  /* ====================== 几何：径向裂纹 ====================== */
  function build() {
    var i, k;
    var ang = [], inner = [], rays = [], endAng = [];

    for (i = 0; i < N; i++) {
      ang.push(-90 + i * (360 / N) + rnd(-13, 13));
      inner.push(rnd(90, 112));
    }
    for (i = 0; i < N; i++) {
      var A = ang[i];
      var r0 = inner[i];
      var pts = [];
      var steps = 3;
      var last = A;
      pts.push([C + Math.cos(deg(A)) * r0, C + Math.sin(deg(A)) * r0]);
      for (k = 1; k <= steps; k++) {
        var t = k / steps;
        var rr = r0 + (R - r0) * t;
        // 越靠外抖得越狠。裂纹才是从镜心笔直、到边上才碎的。
        var perp = rnd(-1, 1) * (R * 0.062) * t * t;
        last = A + (perp / rr) * (180 / Math.PI);
        pts.push([C + Math.cos(deg(last)) * rr, C + Math.sin(deg(last)) * rr]);
      }
      rays.push(pts);
      endAng.push(last);
    }

    var pieces = [];
    for (i = 0; i < N; i++) {
      var j = (i + 1) % N;
      var poly = [];
      for (k = 0; k < rays[i].length; k++) poly.push(rays[i][k]);
      var a0 = endAng[i];
      var a1 = endAng[j] + (endAng[j] < a0 ? 360 : 0);
      for (k = 1; k <= 3; k++) {
        var aa = a0 + (a1 - a0) * k / 3;
        poly.push([C + Math.cos(deg(aa)) * R, C + Math.sin(deg(aa)) * R]);
      }
      for (k = rays[j].length - 1; k >= 0; k--) poly.push(rays[j][k]);

      var mid = (a0 + a1) / 2;
      pieces.push({
        poly: poly,
        label: [C + Math.cos(deg(mid)) * R * 0.60, C + Math.sin(deg(mid)) * R * 0.60],
        dir: mid,
        center: false
      });
    }

    var core = [];
    for (i = 0; i < N; i++) core.push(rays[i][0]);
    pieces.unshift({ poly: core, label: [C, C], dir: -90, center: true });

    return { rays: rays, pieces: pieces };
  }

  function centroid(poly) {
    var x = 0, y = 0;
    for (var i = 0; i < poly.length; i++) { x += poly[i][0]; y += poly[i][1]; }
    return [x / poly.length, y / poly.length];
  }
  function pct(pts) {
    return pts.map(function (p) {
      return (p[0] / VB * 100).toFixed(3) + '% ' + (p[1] / VB * 100).toFixed(3) + '%';
    }).join(',');
  }
  function pathOf(pts, close) {
    return pts.map(function (p, i) {
      return (i ? 'L' : 'M') + p[0].toFixed(2) + ' ' + p[1].toFixed(2);
    }).join(' ') + (close ? ' Z' : '');
  }
  function arcOf(rx, ry, a1, a2) {
    var x1 = C + rx * Math.cos(deg(a1)), y1 = C + ry * Math.sin(deg(a1));
    var x2 = C + rx * Math.cos(deg(a2)), y2 = C + ry * Math.sin(deg(a2));
    return 'M' + x1.toFixed(2) + ' ' + y1.toFixed(2) +
           ' A' + rx + ' ' + ry + ' 0 0 1 ' + x2.toFixed(2) + ' ' + y2.toFixed(2);
  }
  function el(tag, attrs) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) if (attrs.hasOwnProperty(k)) e.setAttribute(k, attrs[k]);
    return e;
  }

  /* ====================== 渲染 ====================== */
  var geo = build();
  var nodes = [];
  var SIZE = { w: 300, h: 400 };

  document.documentElement.style.setProperty('--face', FACE);

  geo.pieces.forEach(function (piece, idx) {
    var page = PAGES[idx] || PAGES[0];
    var cen = centroid(piece.poly);
    var clip = 'polygon(' + pct(piece.poly) + ')';

    var move = document.createElement('div');
    move.className = 'shard-move';
    move.style.transformOrigin = (cen[0] / VB * 100).toFixed(3) + '% ' + (cen[1] / VB * 100).toFixed(3) + '%';

    var fl = document.createElement('div');
    fl.className = 'shard-float';
    fl.style.animationDelay = (-idx * 0.94).toFixed(2) + 's';

    var sh = document.createElement('div');
    sh.className = 'shard';
    sh.style.clipPath = clip;
    sh.style.webkitClipPath = clip;

    var face = document.createElement('div');
    face.className = 'face';

    var sw = document.createElement('div');
    sw.className = 'sweep';
    sw.style.animationDelay = (-idx * 0.6).toFixed(2) + 's';

    // 这一片自己带着的那一小段银框
    var fsvg = el('svg', { 'class':'frame', viewBox:'0 0 1000 1000', preserveAspectRatio:'none' });
    fsvg.appendChild(el('ellipse', { 'class':'ring', cx:C, cy:C, rx:RING, ry:RING }));
    fsvg.appendChild(el('ellipse', { 'class':'inner', cx:C, cy:C, rx:RING_IN, ry:RING_IN }));
    var g1 = el('path', { 'class':'glint', d: arcOf(RING, RING, -102, -32) });
    g1.style.animationDelay = (-idx * 0.5).toFixed(2) + 's';
    fsvg.appendChild(g1);
    var g2 = el('path', { 'class':'glint', d: arcOf(RING, RING, 78, 148) });
    g2.style.animationDelay = (-idx * 0.5 - 3.2).toFixed(2) + 's';
    g2.style.opacity = '.45';
    fsvg.appendChild(g2);

    var lb = document.createElement('div');
    lb.className = 'label' + (piece.center ? ' center' : '');
    lb.style.left = (piece.label[0] / VB * 100).toFixed(3) + '%';
    lb.style.top = (piece.label[1] / VB * 100).toFixed(3) + '%';
    lb.innerHTML = '<span class="c">' + page.c + '</span>' +
                   '<span class="line"></span>' +
                   '<span class="e">' + page.e + '</span>';

    sh.appendChild(face);
    sh.appendChild(sw);
    sh.appendChild(fsvg);
    sh.appendChild(lb);
    fl.appendChild(sh);
    move.appendChild(fl);
    shardsBox.appendChild(move);

    nodes.push({
      move: move, shard: sh, label: lb, page: page,
      dir: piece.dir, center: !!piece.center, seed: idx
    });
  });

  // 裂纹：一道亮的，一道晕的，成对出场
  var crackPairs = [];
  (function drawCracks() {
    var glowG = el('g', {}), mainG = el('g', {});
    function add(d) {
      var a = el('path', { d:d, pathLength:1 });
      var b = el('path', { d:d, pathLength:1, 'class':'glow' });
      glowG.appendChild(b); mainG.appendChild(a);
      crackPairs.push([a, b]);
    }
    geo.rays.forEach(function (pts) { add(pathOf(pts, false)); });
    add(pathOf(geo.pieces[0].poly, true));   // 内圈那一环
    cracks.appendChild(glowG);
    cracks.appendChild(mainG);
  })();

  /* ====================== 时间线 ====================== */
  var T = { sky:60, moon:280, mirror:940, crack:2150, shatter:3180, label:3960, settle:4460 };
  var timers = [];
  var playing = false, settled = false, shattered = false;

  function at(ms, fn) { timers.push(setTimeout(fn, ms)); }
  function clearAll() { timers.forEach(clearTimeout); timers = []; }

  function reset() {
    clearAll();
    settled = false; shattered = false;
    setHot(null);
    $('#sky').classList.remove('on');
    $('#skyMoon').classList.remove('on');
    $('#water').classList.remove('on');
    mirror.classList.remove('on');
    halo.classList.remove('on');
    base.classList.remove('off');
    ghost.classList.remove('on');
    brand.classList.remove('on');
    caption.classList.remove('on');
    replayBtn.classList.remove('on');
    cracks.classList.remove('fade');
    shardsBox.classList.remove('lit');
    flash.classList.remove('go');
    crackPairs.forEach(function (pair) {
      pair.forEach(function (p) { p.style.transition = 'none'; p.style.strokeDashoffset = '1'; });
    });
    nodes.forEach(function (n) {
      n.move.style.transition = 'none';
      n.move.style.transform = 'none';
      n.move.style.opacity = '1';
      n.shard.style.transition = 'none';
      n.shard.style.transform = '';
      n.label.classList.remove('on');
    });
    void mirror.offsetWidth;   // 强制回流，让上面那些 none 立刻落地
    nodes.forEach(function (n) {
      n.move.style.transition = '';
      n.shard.style.transition = '';
    });
  }

  // 碎开后的落点。用像素位移，方向才不会被椭圆拉歪。
  function spread(instant) {
    nodes.forEach(function (n) {
      var d = (n.center ? 0.055 : 0.175) * SIZE.h;
      var a = deg(n.dir);
      n.move.style.transition = instant ? 'none' : 'transform 1.05s cubic-bezier(.16,.84,.24,1)';
      n.move.style.transform =
        'translate(' + (Math.cos(a) * d).toFixed(1) + 'px,' + (Math.sin(a) * d).toFixed(1) + 'px) rotate(' +
        (n.seed % 2 ? 3.4 : -3.4) + 'deg)';
    });
    shattered = true;
    shardsBox.classList.add('lit');
  }

  function play() {
    reset();
    playing = true;

    if (REDUCE) { at(30, function () { spread(true); finish(); }); return; }

    at(T.sky, function () { $('#sky').classList.add('on'); });
    at(T.moon, function () {
      $('#skyMoon').classList.add('on');
      $('#water').classList.add('on');
    });
    at(T.mirror, function () {
      mirror.classList.add('on');
      at(360, function () { halo.classList.add('on'); });
    });

    // 裂纹一道一道爬出来
    at(T.crack, function () {
      crackPairs.forEach(function (pair, i) {
        pair.forEach(function (p) {
          p.style.transition = 'stroke-dashoffset .36s cubic-bezier(.4,0,.3,1) ' + (i * 0.055).toFixed(3) + 's';
          p.style.strokeDashoffset = '0';
        });
      });
    });

    // 碎
    at(T.shatter, function () {
      base.classList.add('off');
      flash.classList.add('go');
      nodes.forEach(function (n, i) {
        var d = (n.center ? rnd(0.04, 0.075) : rnd(0.13, 0.23)) * SIZE.h;
        var a = deg(n.dir + rnd(-16, 16));
        n.move.style.transition = 'transform 1.1s cubic-bezier(.16,.84,.24,1) ' + (i * 0.028).toFixed(3) + 's';
        n.move.style.transform =
          'translate(' + (Math.cos(a) * d).toFixed(1) + 'px,' + (Math.sin(a) * d).toFixed(1) + 'px) rotate(' +
          rnd(-8, 8).toFixed(2) + 'deg)';
      });
      shattered = true;
      shardsBox.classList.add('lit');
      at(460, function () { cracks.classList.add('fade'); });
    });

    at(T.label, function () {
      nodes.forEach(function (n, i) { at(i * 62, function () { n.label.classList.add('on'); }); });
    });

    at(T.settle, finish);
  }

  function finish() {
    playing = false;
    settled = true;
    if (!shattered) spread(false);
    nodes.forEach(function (n) { n.label.classList.add('on'); });
    cracks.classList.add('fade');
    base.classList.add('off');
    halo.classList.add('on');
    ghost.classList.add('on');
    brand.classList.add('on');
    replayBtn.classList.add('on');
  }

  /* ====================== 交互 ====================== */
  var hot = null;
  function setHot(m) {
    if (hot === m) return;
    if (hot) hot.classList.remove('hot');
    hot = m;
    if (hot) { hot.classList.add('hot'); shardsBox.classList.add('dim'); }
    else shardsBox.classList.remove('dim');
  }

  shardsBox.addEventListener('pointerover', function (e) {
    if (!settled) return;
    setHot(e.target.closest ? e.target.closest('.shard-move') : null);
  });
  shardsBox.addEventListener('pointerout', function (e) {
    var m = e.target.closest ? e.target.closest('.shard-move') : null;
    if (m && m === hot && !(e.relatedTarget && m.contains(e.relatedTarget))) setHot(null);
  });
  shardsBox.addEventListener('pointerleave', function () { setHot(null); });

  shardsBox.addEventListener('click', function (e) {
    if (playing) { clearAll(); finish(); return; }
    if (!settled) return;
    var m = e.target.closest && e.target.closest('.shard-move');
    if (!m) return;
    var node = null;
    nodes.forEach(function (n) { if (n.move === m) node = n; });
    if (!node) return;

    setHot(null);
    var cen = centroid(geo.pieces[node.seed].poly);
    var dx = SIZE.w * (0.5 - cen[0] / VB);
    var dy = SIZE.h * (0.5 - cen[1] / VB);

    nodes.forEach(function (n) {
      if (n === node) return;
      n.move.style.transition = 'transform .6s ease,opacity .6s ease';
      n.move.style.opacity = '0';
    });

    m.style.transition = 'transform .95s cubic-bezier(.36,0,.2,1),opacity .5s ease .55s';
    m.style.transform = 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px) scale(9)';
    m.style.opacity = '0';

    at(800, function () {
      caption.innerHTML =
        '<div class="c">' + node.page.c + '</div>' +
        '<div class="n">' + node.page.n + '</div>' +
        '<div class="e">' + node.page.e + '</div>' +
        '<div class="tip">页面还没接上 · 这一步只走个样子</div>';
      caption.classList.add('on');
    });
    at(2600, function () {
      caption.classList.remove('on');
      at(540, play);
    });
  });

  replayBtn.addEventListener('click', function (e) { e.stopPropagation(); play(); });
  document.addEventListener('click', function () {
    if (playing) { clearAll(); finish(); }
  });

  /* ====================== 尺寸 ====================== */
  function size() {
    var w = window.innerWidth, h = window.innerHeight;
    var H = Math.min(h * 0.56, w * 1.18, 660);
    var W = H * RATIO;
    SIZE.h = H; SIZE.w = W;
    mirror.style.setProperty('--w', W.toFixed(1) + 'px');
    mirror.style.setProperty('--h', H.toFixed(1) + 'px');
  }
  size();
  window.addEventListener('resize', size);
  window.addEventListener('orientationchange', function () { setTimeout(size, 220); });

  play();
})();
</script>
</body>
</html>
