<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>镜花水月 · 拾光</title>
<style>
:root{
  --bg:#F0F1F3;
  --card:#FFFFFF;
  --ink:#1A1C20;
  --mid:#8A8D93;
  --pale:#B9BCC2;
  --line:#E3E4E7;
  --hair:#EDEEF0;
  --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
  --sans:"PingFang SC","Noto Sans CJK SC",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.7;
  padding:0 0 64px;
  -webkit-font-smoothing:antialiased;
}
.page{max-width:760px;margin:0 auto;padding:0 26px}

/* 顶栏 */
.top{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:34px 0 22px;
}
.top .zh{font-family:var(--serif);font-size:13px;letter-spacing:.42em;color:var(--ink)}
.top .lat{font-family:var(--serif);font-size:11px;letter-spacing:.3em;color:var(--pale)}

/* 图版 */
.plate{
  position:relative;background:var(--card);
  border:1px solid var(--line);
  box-shadow:0 1px 2px rgba(20,22,26,.03),0 12px 30px -22px rgba(20,22,26,.28);
  padding:0;
}
.plate svg{display:block;width:100%;height:auto}
.corner{position:absolute;width:13px;height:13px;border:0 solid var(--pale);opacity:.7}
.corner.tl{top:11px;left:11px;border-top-width:1px;border-left-width:1px}
.corner.tr{top:11px;right:11px;border-top-width:1px;border-right-width:1px}
.corner.bl{bottom:11px;left:11px;border-bottom-width:1px;border-left-width:1px}
.corner.br{bottom:11px;right:11px;border-bottom-width:1px;border-right-width:1px}

/* 图注条 */
.caption{
  display:flex;align-items:baseline;gap:14px;
  padding:11px 2px 12px;
  border-bottom:1px solid var(--line);
  font-size:11px;letter-spacing:.16em;color:var(--mid);
}
.caption .fr{font-family:var(--serif);font-style:italic;letter-spacing:.06em;font-size:12px;color:var(--ink);opacity:.75}
.caption .zh{font-family:var(--serif);color:var(--ink);opacity:.55}
.caption .no{margin-left:auto;font-family:var(--serif);color:var(--pale);letter-spacing:.2em}

/* 主标题 */
.hero{padding:46px 0 40px}
.hero h1{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(30px,7.4vw,46px);
  letter-spacing:.05em;line-height:1.34;
}
.hero .fr{
  margin-top:14px;
  font-family:var(--serif);font-style:italic;
  font-size:12.5px;letter-spacing:.05em;color:var(--mid);
}

/* 元数据 */
.meta{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:1px;background:var(--hair);
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
}
.meta>div{background:var(--bg);padding:16px 2px}
.meta dt{font-size:10px;letter-spacing:.24em;color:var(--pale);margin-bottom:5px}
.meta dd{font-family:var(--serif);font-size:13.5px;letter-spacing:.06em}

/* 目录 */
.index{margin-top:52px}
.index .head{
  display:flex;align-items:baseline;justify-content:space-between;
  padding-bottom:10px;border-bottom:1px solid var(--ink);
}
.index .head b{font-family:var(--serif);font-weight:400;font-size:14px;letter-spacing:.24em}
.index .head span{font-family:var(--serif);font-size:10.5px;letter-spacing:.26em;color:var(--pale)}
.index a{
  display:flex;align-items:baseline;gap:16px;
  padding:19px 2px;border-bottom:1px solid var(--line);
  text-decoration:none;color:inherit;
  transition:padding-left .28s ease,border-color .28s ease;
}
.index a i{
  font-family:var(--serif);font-style:normal;font-size:10.5px;letter-spacing:.16em;
  color:var(--pale);width:26px;flex:none;
  transition:color .28s ease;
}
.index a b{font-family:var(--serif);font-weight:400;font-size:17.5px;letter-spacing:.16em}
.index a em{
  margin-left:auto;font-family:var(--serif);font-style:italic;
  font-size:11.5px;letter-spacing:.05em;color:var(--pale);
  transition:color .28s ease,opacity .28s ease;
}
.index a:hover{padding-left:9px;border-color:var(--pale)}
.index a:hover i{color:var(--ink)}
.index a:hover em{color:var(--mid)}

/* 页脚 */
footer{margin-top:56px}
.strip{display:flex;gap:8px}
.strip span{
  flex:1;height:46px;border:1px solid var(--line);background:var(--card);
}
.strip span:nth-child(2){opacity:.72}
.strip span:nth-child(3){opacity:.5}
.strip span:nth-child(4){opacity:.32}
.strip span:nth-child(5){opacity:.18}
.pager{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-top:20px;font-family:var(--serif);font-size:10.5px;
  letter-spacing:.28em;color:var(--pale);
}

/* 呼吸 */
@keyframes breathe{0%,100%{opacity:.16}50%{opacity:.42}}
.ripple{animation:breathe 7.5s ease-in-out infinite}
.ripple.d1{animation-delay:-2.5s}
.ripple.d2{animation-delay:-5s}
@media (prefers-reduced-motion:reduce){.ripple{animation:none}}
@media (max-width:420px){
  .page{padding:0 20px}
  .meta{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<main class="page">

  <header class="top">
    <span class="zh">镜花水月</span>
    <span class="lat">MMXXVI</span>
  </header>

  <figure class="plate">
    <svg viewBox="0 0 640 400" role="img" aria-label="镜。水。月。">
      <g fill="none" stroke="#1A1C20" stroke-linecap="round">
        <!-- 镜。椭圆。细银边 -->
        <ellipse cx="320" cy="164" rx="84" ry="122" stroke-width="1.2" opacity=".78"/>
        <ellipse cx="320" cy="164" rx="76" ry="114" stroke-width=".7" opacity=".26"/>
        <!-- 镜中月 -->
        <circle cx="320" cy="142" r="32" stroke-width="1" opacity=".5"/>
        <path d="M304 122 A32 32 0 0 1 336 122" stroke-width=".7" opacity=".3"/>
        <!-- 镜心一道斜光 -->
        <path d="M266 96 L374 118" stroke-width=".7" opacity=".22"/>
        <!-- 镜座 -->
        <path d="M300 286 L302 302 M340 286 L338 302" stroke-width="1" opacity=".5"/>
        <path d="M288 304 L352 304" stroke-width="1" opacity=".45"/>
      </g>

      <!-- 水面 -->
      <g fill="none" stroke="#1A1C20" stroke-linecap="round">
        <path d="M64 322 L576 322" stroke-width="1" opacity=".62"/>
        <path d="M186 336 L454 336" stroke-width=".8" opacity=".28"/>
        <path d="M246 350 L394 350" stroke-width=".8" opacity=".16"/>
      </g>
      <g class="ripple" fill="none" stroke="#1A1C20" stroke-linecap="round">
        <path d="M120 336 L210 336" stroke-width=".9"/>
        <path d="M432 336 L512 336" stroke-width=".9"/>
      </g>
      <g class="ripple d1" fill="none" stroke="#1A1C20" stroke-linecap="round">
        <path d="M212 350 L300 350" stroke-width=".9"/>
        <path d="M356 350 L440 350" stroke-width=".9"/>
      </g>
      <g class="ripple d2" fill="none" stroke="#1A1C20" stroke-linecap="round">
        <path d="M286 364 L358 364" stroke-width=".9"/>
      </g>

      <!-- 倒影。虚 -->
      <g fill="none" stroke="#1A1C20" stroke-linecap="round" stroke-dasharray="3 6">
        <path d="M248 322 A84 60 0 0 0 392 322" stroke-width=".8" opacity=".2"/>
        <path d="M282 322 A46 34 0 0 0 358 322" stroke-width=".8" opacity=".14"/>
      </g>
    </svg>
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
  </figure>

  <div class="caption">
    <span class="fr">les éclats</span>
    <span class="zh">镜 · 水 · 月</span>
    <span class="no">No. 001</span>
  </div>

  <section class="hero">
    <h1>回来啦，小猫。</h1>
    <p class="fr">Le miroir se brise. La lune demeure.</p>
  </section>

  <dl class="meta">
    <div><dt>编 号</dt><dd>No. 001</dd></div>
    <div><dt>日 期</dt><dd>OCT. 18</dd></div>
    <div><dt>比 例</dt><dd>1 : 1.78 · 竖</dd></div>
    <div><dt>许 可</dt><dd>此间私有</dd></div>
  </dl>

  <nav class="index">
    <div class="head"><b>目 录</b><span>VI ENTRÉES</span></div>
    <a href="#"><i>i</i><b>镜月相</b><em>la lune</em></a>
    <a href="#"><i>ii</i><b>表</b><em>l'heure</em></a>
    <a href="#"><i>iii</i><b>愿</b><em>le vœu</em></a>
    <a href="#"><i>iv</i><b>券</b><em>le billet</em></a>
    <a href="#"><i>v</i><b>记</b><em>la note</em></a>
    <a href="#"><i>vi</i><b>存</b><em>le dépôt</em></a>
  </nav>

  <footer>
    <div class="strip"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="pager"><span>I</span><span>i / vi</span></div>
  </footer>

</main>
</body>
</html>
